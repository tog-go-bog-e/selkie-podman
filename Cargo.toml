[package]
name = "podman-desktop-rs"
version = "0.1.0"
edition = "2021"
description = "A tiny Podman Desktop reimplementation in Rust using GPUI"
license = "Apache-2.0"
publish = false

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# gpui -> gpui_http_client -> zed-async-tar -> xattr 0.2.3 still references
# `libc::ENOATTR` on Linux; libc 0.2.191 removed it. Remove once xattr is fixed.
libc = "=0.2.189"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
vt100 = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
